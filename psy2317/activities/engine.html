<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSY 2317 Activity</title>
<style>
:root{--green:#154734;--orange:#e87500;--ink:#1f2a24;--muted:#4a5a52;--line:#c9d8cf;--tint:#eef3f0;--good:#e3f2e8;--goodb:#2e7d4f;--bad:#fdecea;--badb:#b3261e;--amber:#fff4e0;--amberb:#b25e00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.5}
.wrap{max-width:840px;margin:0 auto;padding:14px 16px 40px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;color:var(--green);margin:4px 0 4px}
.budget{display:inline-block;background:var(--tint);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--green);margin-bottom:10px}
.intro{margin:6px 0 14px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;background:#fff}
.card.cur{border-color:var(--green);box-shadow:0 0 0 2px #15473422}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--green);background:var(--green);color:#fff;padding:7px 14px;margin:4px 6px 4px 0}
button.alt{background:#fff;color:var(--green)}
button.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:6px 0;padding:10px 12px}
button.opt:hover:not(:disabled){border-color:var(--green);background:var(--tint)}
button.opt.right{background:var(--good);border-color:var(--goodb)}
button.opt.wrong{background:var(--bad);border-color:var(--badb)}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.fb.good{background:var(--good);border-left:4px solid var(--goodb)}
.fb.bad{background:var(--bad);border-left:4px solid var(--badb)}
.fb.hint{background:var(--amber);border-left:4px solid var(--amberb)}
.small{font-size:14px;color:var(--muted)}
table.d{border-collapse:collapse;margin:8px 0;font-size:15px}
table.d th,table.d td{border:1px solid var(--line);padding:4px 10px;text-align:left}
table.d th{background:var(--green);color:#fff}
.scores{font-size:17px;font-weight:600;background:var(--tint);border-radius:8px;padding:8px 12px}
input[type=text]{font:inherit;padding:6px 8px;border:1px solid #8aa597;border-radius:6px;width:120px}
textarea{font:inherit;width:100%;min-height:110px;padding:8px;border:1px solid #8aa597;border-radius:6px}
select{font:inherit;padding:6px;border-radius:6px}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.stage{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.stage.on{background:var(--green);color:#fff;border-color:var(--green)}
.stage.done{background:var(--good);color:var(--green);border-color:var(--goodb)}
.bar{height:8px;background:var(--tint);border-radius:99px;margin:8px 0 14px;overflow:hidden}
.bar>div{height:100%;background:var(--orange);width:0;transition:width .3s}
.lbl{font-weight:600;margin-bottom:6px}
.done-box{background:var(--tint);border-radius:10px;padding:14px 16px;margin-top:14px}
ul.ck{list-style:none;padding:0}
ul.ck li{margin:4px 0}
button{min-height:44px}
input[type=text],textarea,select{font-size:16px;min-height:40px}
.card{overflow-x:auto}
.codebox{margin-top:12px;padding:12px 16px;border:2px solid var(--green);border-radius:10px;background:#fff;font-size:18px}
.codebox strong{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;letter-spacing:2px;color:var(--green)}
@media (max-width:520px){.wrap{padding:10px 10px 30px}h1{font-size:21px}.card{padding:12px}input[type=text]{width:100%}}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style></head>
<body><div class="wrap"><main id="app" aria-live="polite"><p>Loading…</p></main></div>
<script src="stats.js"></script><script src="gen.js"></script>
<script>
(function(){
const app=document.getElementById('app');
const q=new URLSearchParams(location.search);const id=q.get('a')||'';
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function head(d){app.innerHTML='';app.appendChild($('h1','',d.title));app.appendChild($('div','budget','Budget: '+d.budget+' min &middot; Complete every item'));if(d.intro)app.appendChild($('div','intro',d.intro))}
function bar(){const b=$('div','bar');const i=$('div');b.appendChild(i);return {el:b,set:p=>i.style.width=Math.round(p*100)+'%'}}
fetch('data/'+encodeURIComponent(id)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(run).catch(()=>{app.innerHTML='<p>This activity could not be loaded. Check the address and try again.</p>'});
function run(d){head(d);({quiz:quiz,sort:sort,compute:compute,transfer:transfer})[d.type](d)}

/* ---------- quiz and sort ---------- */
function sort(d){d.type='quiz';d.items=d.items.map(it=>({q:'<strong>'+it.s+'</strong>',o:['True','False','It depends'],ans:{T:0,F:1,D:2}[it.t],why:it.why}));d.fixed=true;quiz(d)}
function quiz(d){
  let order=d.items.map((it,i)=>i),missed=[],right=0,pos=0,round=1;const box=$('div');app.appendChild(box);
  function show(){
    box.innerHTML='';
    if(pos>=order.length)return end();
    const it=d.items[order[pos]];const b=bar();b.set(pos/order.length);box.appendChild(b.el);
    const c=$('div','card cur');c.appendChild($('div','small','Item '+(pos+1)+' of '+order.length+(round>1?' (retry)':'')));
    if(it.ctx)c.appendChild($('div','',it.ctx));c.appendChild($('div','lbl',it.q));
    const opts=it.o.map((t,i)=>({t,i}));const list=d.fixed?opts:shuffle(opts);const correct=it.ans!=null?it.ans:0;
    const fb=$('div');let answered=false;
    list.forEach(o=>{const bt=$('button','opt',o.t);bt.onclick=()=>{if(answered)return;answered=true;
      list.forEach((x,k)=>{const el=c.querySelectorAll('button.opt')[k];el.disabled=true;if(x.i===correct)el.classList.add('right')});
      if(o.i===correct){right++;bt.classList.add('right');fb.className='fb good';fb.innerHTML='<strong>Correct.</strong> '+(it.why||'')}
      else{missed.push(order[pos]);bt.classList.add('wrong');fb.className='fb bad';fb.innerHTML='<strong>Not quite.</strong> '+(it.why||'');}
      const nx=$('button','','Next');nx.onclick=()=>{pos++;show()};fb.appendChild($('div')).appendChild(nx);nx.focus()};c.appendChild(bt)});
    c.appendChild(fb);box.appendChild(c);if(pos>0||round>1){const f=c.querySelector('button.opt');if(f)f.focus({preventScroll:true})}}
  function end(){
    const b=bar();b.set(1);box.appendChild(b.el);
    const n=order.length;const c=$('div','done-box');
    c.innerHTML='<h2 style="margin-top:0">Round complete</h2><p>You answered <strong>'+right+' of '+n+'</strong> correctly'+(round>1?' in this retry':' on the first try')+'.</p>';
    if(missed.length){const p=$('p','','Items to revisit: '+missed.length+'. Retrying the ones you missed is the fastest way to make them stick.');c.appendChild(p);
      const bt=$('button','','Retry the '+missed.length+' missed item'+(missed.length>1?'s':''));bt.onclick=()=>{order=missed.slice();missed=[];right=0;pos=0;round++;show()};c.appendChild(bt)}
    else{c.appendChild($('p','','Every item is correct. Copy your completion code into the Activity Log, mark this page done in Canvas, and move on.'));c.appendChild(codeBox())}
    box.appendChild(c)}
  show()}

/* ---------- compute with stages ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const CODE=hash('psy2317|'+id).toString(36).toUpperCase().slice(-5);
const codeBox=()=>{const e=$('div','codebox','Completion code: <strong>'+CODE+'</strong><br><span class="small">Enter this code in the Activity Log quiz for this module.</span>');return e};
function compute(d){
  const base=hash(id);const names=['Study a worked example','Try one with hints','Do one on your own'];let stage=0;const nav=$('div','stages');app.appendChild(nav);const box=$('div');app.appendChild(box);
  const done=[false,false,false];
  function navr(){nav.innerHTML='';names.forEach((n,i)=>nav.appendChild($('span','stage'+(i===stage?' on':done[i]?' done':''),(i+1)+'. '+n)))}
  function start(){navr();box.innerHTML='';
    const seed=stage===0?base:stage===1?base+17:(Math.floor(Math.random()*1e6)+101);
    const p=GEN[d.gen](STATS.rng(seed));
    box.appendChild($('div','card',p.intro+(p.table||'')));
    if(stage===0)return study(p);attempt(p)}
  function study(p){
    box.appendChild($('div','small','Read each step slowly and ask why it works. The next stage asks you to do the same steps on new numbers.'));
    p.steps.forEach((s,i)=>{const a=s.k==='num'?fmtv(s.ans):s.opts[s.ans];box.appendChild($('div','card','<div class="lbl">Step '+(i+1)+'. '+s.label+'</div><div class="fb good"><strong>'+a+'</strong>. '+s.expl+'</div>'))});
    const bt=$('button','','I followed this. Start stage 2');bt.onclick=()=>{done[0]=true;stage=1;start()};box.appendChild(bt)}
  function fmtv(x){return (Math.round(x*100)/100).toString()}
  function attempt(p){
    const total=p.steps.length;let idx=0,clean=0,helped=0;const b=bar();box.appendChild(b.el);const holder=$('div');box.appendChild(holder);
    function next(){b.set(idx/total);holder.innerHTML='';if(idx>=total)return finish();
      const s=p.steps[idx];const c=$('div','card cur');c.appendChild($('div','lbl','Step '+(idx+1)+' of '+total+'. '+s.label));
      let tries=0,used=false;const fb=$('div');const hintOn=stage===1;
      if(hintOn&&s.hint)c.appendChild($('div','small','Hint: '+s.hint));
      let get,btn;
      if(s.k==='num'){const inp=$('input');inp.type='text';inp.setAttribute('inputmode','decimal');inp.setAttribute('aria-label','Your answer');c.appendChild(inp);get=()=>inp.value;inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});setTimeout(()=>inp.focus(),30)}
      else{const sel=$('select');sel.setAttribute('aria-label','Your answer');sel.appendChild($('option','','Choose…'));s.opts.forEach((o,i)=>{const op=$('option','',o);op.value=i;sel.appendChild(op)});c.appendChild(sel);get=()=>sel.value}
      btn=$('button','','Check');c.appendChild(btn);
      const sh=$('button','alt','Show me the answer');sh.style.display='none';c.appendChild(sh);
      const hb=$('button','alt','Give me a hint');if(!hintOn&&s.hint)c.appendChild(hb);
      hb.onclick=()=>{used=true;fb.className='fb hint';fb.innerHTML='<strong>Hint:</strong> '+s.hint};
      const adv=ok=>{inpDisable();const nx=$('button','','Next step');nx.onclick=()=>{idx++;next()};fb.appendChild($('div')).appendChild(nx);nx.focus()};
      function inpDisable(){c.querySelectorAll('input,select,button').forEach(e=>{if(e.textContent!=='Next step')e.disabled=true})}
      btn.onclick=()=>{
        const raw=String(get()).trim().replace(/,/g,'');if(raw===''||raw==='Choose…'){fb.className='fb hint';fb.innerHTML='Enter an answer first.';return}
        tries++;let ok=false,msg='';
        if(s.k==='num'){const v=parseFloat(raw);if(isNaN(v)){fb.className='fb hint';fb.innerHTML='Enter a number.';return}
          ok=Math.abs(v-s.ans)<=s.tol;if(!ok)for(const w of s.wrong){if(w[1]&&Math.abs(v-w[0])<=Math.max(s.tol,Math.abs(w[0])*0.004)){msg=w[1];break}}}
        else{ok=parseInt(raw,10)===s.ans}
        if(ok){if(tries===1&&!used)clean++;else helped++;fb.className='fb good';fb.innerHTML='<strong>Correct.</strong> '+s.expl;adv(true);sh.style.display='none';return}
        fb.className='fb bad';fb.innerHTML='<strong>Not quite.</strong> '+(msg||'Check your arithmetic and try again.')+(s.hint&&!hintOn?'':'');
        if(tries>=2||(s.k==='choice'&&tries>=1))sh.style.display='inline-block'};
      sh.onclick=()=>{helped++;const a=s.k==='num'?fmtv(s.ans):s.opts[s.ans];fb.className='fb hint';fb.innerHTML='<strong>The answer is '+a+'.</strong> '+s.expl;adv(false);sh.style.display='none'};
      c.appendChild(fb);holder.appendChild(c)}
    function finish(){b.set(1);const c=$('div','done-box');c.innerHTML='<h2 style="margin-top:0">Stage '+(stage+1)+' complete</h2><p>You got <strong>'+clean+' of '+total+'</strong> steps right on the first try and used help on '+helped+'.</p>';
      done[stage]=true;navr();
      if(stage<2){const bt=$('button','','Start stage '+(stage+2));bt.onclick=()=>{stage++;start()};c.appendChild(bt)}
      else{c.appendChild($('p','','Try another problem with new numbers if any step felt shaky. Then mark this page done in Canvas.'));c.appendChild(codeBox());const bt=$('button','alt','New problem');bt.onclick=()=>start();c.appendChild(bt)}
      holder.appendChild(c)}
    next()}
  start()}

/* ---------- transfer challenge ---------- */
function transfer(d){
  app.appendChild($('div','card',d.scenario));let i=0;const box=$('div');app.appendChild(box);const b=bar();app.insertBefore(b.el,box);
  function show(){box.innerHTML='';b.set(i/d.parts.length);if(i>=d.parts.length){const c=$('div','done-box','<h2 style="margin-top:0">Challenge complete</h2><p>Reread your own written answers next to the expert analysis. Whatever surprised you is the thing to study again. Then mark this page done in Canvas.</p>');c.appendChild(codeBox());box.appendChild(c);b.set(1);return}
    const p=d.parts[i],c=$('div','card cur');c.appendChild($('div','small','Question '+(i+1)+' of '+d.parts.length));c.appendChild($('div','lbl',p.q));
    if(p.type==='mc'){const fb=$('div');let ans=false;const list=shuffle(p.o.map((t,k)=>({t,k})));
      list.forEach(o=>{const bt=$('button','opt',o.t);bt.onclick=()=>{if(ans)return;ans=true;c.querySelectorAll('button.opt').forEach((e,k)=>{e.disabled=true;if(list[k].k===0)e.classList.add('right')});
        if(o.k===0){fb.className='fb good';fb.innerHTML='<strong>Correct.</strong> '+p.why}else{bt.classList.add('wrong');fb.className='fb bad';fb.innerHTML='<strong>Not quite.</strong> '+p.why}
        const nx=$('button','','Next');nx.onclick=()=>{i++;show()};fb.appendChild($('div')).appendChild(nx);nx.focus()};c.appendChild(bt)});c.appendChild(fb)}
    else{const ta=$('textarea');ta.setAttribute('aria-label','Your written answer');c.appendChild(ta);const fb=$('div');const bt=$('button','','Compare with the expert analysis');
      bt.onclick=()=>{if(ta.value.trim().length<25){fb.className='fb hint';fb.innerHTML='Write at least a couple of sentences before comparing. The comparison only helps after you commit to your own answer.';return}
        ta.disabled=true;bt.disabled=true;fb.className='fb good';fb.innerHTML='<strong>Expert analysis.</strong> '+p.model+'<p class="lbl" style="margin-top:10px">Check your own answer. Tick what you included.</p><ul class="ck">'+(p.check||[]).map((t,k)=>'<li><label><input type="checkbox"> '+t+'</label></li>').join('')+'</ul>';
        const nx=$('button','','Continue');nx.onclick=()=>{i++;show()};fb.appendChild(nx)};c.appendChild(bt);c.appendChild(fb)}
    box.appendChild(c)}
  show()}
})();
</script></body></html>
